name: Mise à jour quotidienne

on:
  schedule:
    # Objectif : 8 h heure de Paris toute l'année. GitHub ne connaît que l'heure UTC,
    # donc deux déclenchements et le job "horaire" ne garde que le bon :
    # 06:00 UTC = 8 h en été (UTC+2), 07:00 UTC = 8 h en hiver (UTC+1).
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: 'Date US des matches (AAAA-MM-JJ), vide = nuit dernière'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          if [ -z "$CRON" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Décalage de Paris ce jour-là : +0200 en été, +0100 en hiver.
          if [ "$(TZ=Europe/Paris date +%z)" = "+0200" ]; then WANTED='0 6 * * *'; else WANTED='0 7 * * *'; fi
          if [ "$CRON" = "$WANTED" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Pas 8 h à Paris pour ce déclenchement : rien à faire."; fi

  update:
    needs: horaire
    if: needs.horaire.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Récupérer et rédiger la nuit NBA
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update.mjs ${{ inputs.date && format('--date={0}', inputs.date) || '' }}

      - name: Enregistrer les données
        if: github.event_name != 'push'
        run: |
          git config user.name "nba-recap-bot"
          git config user.email "nba-recap-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Données NBA du $(date -u +%F)"
          git push

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
